<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Workspace Auth</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Форма первичной настройки (Setup) -->
    <div id="setupPanel" class="card hidden">
        <h2>Создание пространства</h2>
        <form id="setupForm">
            <input type="password" id="setupPassword" placeholder="Придумайте пароль (мин. 6 символов)" required minlength="6">
            <button type="submit">Создать пространство</button>
        </form>
    </div>

    <!-- Форма входа (Login) -->
    <div id="authPanel" class="card hidden">
        <h2>Вход в пространство</h2>
        <form id="loginForm">
            <input type="password" id="loginPassword" placeholder="Введите пароль" required>
            <button type="submit">Войти</button>
        </form>
    </div>

    <!-- Главный экран приложения -->
    <div id="dashboardPanel" class="card hidden" style="max-width: 800px;">
        <h2>Добро пожаловать!</h2>
        <p>Авторизация успешно пройдена.</p>
    </div>

    <script>
        const API_URL = "https://ouslqtffwgbtqqslwiki.supabase.co/functions/v1/workspace-api";
        const urlParams = new URLSearchParams(window.location.search);
        const WORKSPACE_ID = urlParams.get('id');

        const authPanel = document.getElementById('authPanel');
        const setupPanel = document.getElementById('setupPanel');
        const appPanel = document.getElementById('dashboardPanel');

        async function initAuth() {
            if (!WORKSPACE_ID) {
                document.body.innerHTML = "<h2 style='text-align:center;'>Ошибка: Не указан ID пространства в ссылке (?id=...)</h2>";
                return;
            }

            if (sessionStorage.getItem('USER_TOKEN')) {
                startApp();
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: WORKSPACE_ID, action: "get_data" })
                });
                const data = await res.json();

                if (res.status === 403 || (res.ok && !data.data?.masterHash)) {
                    setupPanel.classList.remove('hidden');
                } else if (res.ok && data.data?.masterHash) {
                    authPanel.classList.remove('hidden');
                } else {
                    console.error("Неизвестный ответ сервера:", data);
                }
            } catch (e) {
                console.error("Ошибка сети:", e);
                alert("Ошибка подключения к серверу.");
            }
        }

        async function handleSetup(event) {
            event.preventDefault();
            const password = document.getElementById('setupPassword').value;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: WORKSPACE_ID, action: "setup", secret: password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    sessionStorage.setItem('USER_TOKEN', data.token);
                    updateUrlAndStartApp();
                } else {
                    alert(data.error || "Ошибка при регистрации пространства.");
                }
            } catch (e) {
                alert("Ошибка сети при отправке запроса.");
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: WORKSPACE_ID, action: "login", secret: password })
                });
                const data = await res.json();

                if (res.ok && data.token) {
                    sessionStorage.setItem('USER_TOKEN', data.token);
                    updateUrlAndStartApp();
                } else {
                    alert(data.error || "Неверный пароль.");
                }
            } catch (e) {
                alert("Ошибка сети при отправке запроса.");
            }
        }

        function updateUrlAndStartApp() {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${WORKSPACE_ID}`;
            window.history.pushState({ path: newUrl }, '', newUrl);
            startApp();
        }

        function startApp() {
            authPanel.classList.add('hidden');
            setupPanel.classList.add('hidden');
            appPanel.classList.remove('hidden');
            if (typeof loadWorkspaceData === 'function') {
                loadWorkspaceData();
            }
        }

        document.getElementById('setupForm')?.addEventListener('submit', handleSetup);
        document.getElementById('loginForm')?.addEventListener('submit', handleLogin);

        initAuth();
    </script>
</body>
</html>
