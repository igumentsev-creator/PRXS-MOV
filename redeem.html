<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Access Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f1f5f9; color: #1e293b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        
        .auth-card { background: white; border-radius: 18px; padding: 35px; width: 100%; max-width: 420px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; border-top: 5px solid #2563eb; }
        .auth-card h2 { color: #1e3a8a; margin-bottom: 12px; font-size: 24px; }
        .auth-card p { color: #64748b; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: all 0.2s; text-align: center; background: #f8fafc; }
        input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); background: #ffffff; }
        
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 15px; transition: background 0.2s; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; cursor: not-allowed; box-shadow: none; }
        
        .toggle-link { color: #3b82f6; cursor: pointer; font-size: 14px; font-weight: bold; text-decoration: none; transition: color 0.2s; display: inline-block; }
        .toggle-link:hover { color: #1e3a8a; text-decoration: underline; }
        
        .message { font-size: 13px; font-weight: bold; margin-bottom: 15px; display: none; padding: 10px; border-radius: 8px; }
        .msg-error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
        .msg-success { background: #dcfce3; color: #16a34a; border: 1px solid #bbf7d0; }
        .msg-info { background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; }
    </style>
</head>
<body>

<div class="auth-card">
    <h2 id="titleEl">🚀 Access Activation</h2>
    <p id="descEl">Enter your activation code and create a secure personal password.</p>
    
    <div id="messageEl" class="message"></div>

    <input type="text" id="codeInput" placeholder="Activation Code (e.g. Alpha-777)">
    <input type="password" id="passwordInput" placeholder="Create Admin Password">
    
    <button id="submitBtn">Activate & Enter</button>
    
    <div class="toggle-link" id="toggleModeBtn">Already have a workspace? Log in</div>
</div>

<script>
    const API_URL = "https://ouslqtffwgbtqqslwiki.supabase.co/functions/v1/workspace-api";
    
    let currentMode = 'activate'; 
    
    const els = {
        title: document.getElementById('titleEl'),
        desc: document.getElementById('descEl'),
        message: document.getElementById('messageEl'),
        codeInput: document.getElementById('codeInput'),
        passwordInput: document.getElementById('passwordInput'),
        submitBtn: document.getElementById('submitBtn'),
        toggleBtn: document.getElementById('toggleModeBtn')
    };

    function showMessage(type, text) {
        els.message.className = `message msg-${type}`;
        els.message.innerText = text;
        els.message.style.display = 'block';
    }

    function hideMessage() {
        els.message.style.display = 'none';
    }

    function switchMode(mode) {
        currentMode = mode;
        hideMessage();
        
        if (mode === 'activate') {
            els.title.innerText = "🚀 Access Activation";
            els.desc.innerText = "Enter your activation code and create a secure personal password to claim ownership.";
            els.codeInput.placeholder = "Activation Code (e.g. Alpha-777)";
            els.passwordInput.placeholder = "Create Admin Password";
            els.submitBtn.innerText = "Activate & Enter";
            els.toggleBtn.innerText = "Already have a workspace? Log in";
        } else {
            els.title.innerText = "🔒 Workspace Login";
            els.desc.innerText = "Enter your Workspace ID and administrator password or regional security token.";
            els.codeInput.placeholder = "Workspace ID or Code";
            els.passwordInput.placeholder = "Password / Security Token";
            els.submitBtn.innerText = "Log In";
            els.toggleBtn.innerText = "Need to activate a new code? Click here";
        }
    }

    els.toggleBtn.addEventListener('click', () => {
        switchMode(currentMode === 'activate' ? 'login' : 'activate');
    });

    els.submitBtn.addEventListener('click', async () => {
        const code = els.codeInput.value.trim();
        const secret = els.passwordInput.value.trim();
        
        if (!code || !secret) {
            showMessage('error', 'Please fill in both fields.');
            return;
        }

        els.submitBtn.disabled = true;
        els.submitBtn.innerText = "🔄 Processing...";
        showMessage('info', 'Connecting to secure server...');

        try {
            const action = currentMode === 'activate' ? 'setup' : 'login';
            
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action: action, id: code, secret: secret })
            });
            
            const data = await response.json();
            
            if (data.ok) {
                showMessage('success', '✅ Access granted! Redirecting...');
                
                // Бэкенд может вернуть правильный системный ID (ws-...). 
                // Если нет, используем введенный код.
                const targetId = data.id || data.workspace_id || code;
                
                // Сохраняем токен в sessionStorage на всякий случай
                sessionStorage.setItem('USER_TOKEN', secret);
                
                // Перенаправляем на платформу
                setTimeout(() => {
                    window.location.href = `platform.html?id=${targetId}#token=${secret}`;
                }, 800);
            } else {
                showMessage('error', '❌ ' + (data.error || 'Authentication failed.'));
                els.submitBtn.disabled = false;
                els.submitBtn.innerText = currentMode === 'activate' ? "Activate & Enter" : "Log In";
            }
        } catch (err) {
            showMessage('error', '❌ Network error. Server is unreachable.');
            els.submitBtn.disabled = false;
            els.submitBtn.innerText = currentMode === 'activate' ? "Activate & Enter" : "Log In";
        }
    });

    // Отработка нажатия Enter в полях ввода
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            els.submitBtn.click();
        }
    });

    // --- АВТОМАТИЧЕСКИЙ ВХОД ДЛЯ ФИЛИАЛОВ И ПО ЗАКЛАДКАМ ---
    const presetId = new URLSearchParams(window.location.search).get('id');
    
    // Достаем токен из хэша ссылки (например: #token=usr_abcd123)
    let presetToken = '';
    if (window.location.hash.startsWith('#token=')) {
        presetToken = window.location.hash.substring(7);
    }

    if (presetId) { 
        els.codeInput.value = presetId; 
        switchMode('login'); 
        
        // Если в ссылке был токен, подставляем его и входим автоматически
        if (presetToken) {
            els.passwordInput.value = presetToken;
            els.submitBtn.click();
        }
    }
</script>
</body>
</html>
