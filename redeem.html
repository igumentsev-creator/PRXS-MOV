<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Активация доступа</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2563eb; }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Активация доступа</h2>
        <form id="redeemForm">
            <input type="text" id="code" placeholder="Введите код активации (например, AppSumo)" required>
            <input type="password" id="password" placeholder="Придумайте пароль (мин. 6 символов)" required minlength="6">
            <button type="submit">Активировать и войти</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>

    <script>
        const API_URL = "https://ouslqtffwgbtqqslwiki.supabase.co/functions/v1/workspace-api";

        document.getElementById('redeemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const codeInput = document.getElementById('code').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = "";

            // Генерируем уникальный ID пространства на основе введенного кода
            const workspaceId = "ws-" + btoa(codeInput).replace(/[^a-zA-Z0-9]/g, "").toLowerCase().slice(0, 16);

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        id: workspaceId,
                        action: "setup",
                        secret: passwordInput
                    })
                });

                const result = await response.json();

                if (response.ok && result.token) {
                    sessionStorage.setItem('USER_TOKEN', result.token);
                    // Перенаправляем на главный файл с созданным ID пространства
                    window.location.href = `index.html?id=${workspaceId}`;
                } else {
                    errorDiv.textContent = result.error || "Ошибка активации кода.";
                }
            } catch (err) {
                console.error(err);
                errorDiv.textContent = "Ошибка сети при обращении к серверу.";
            }
        });
    </script>
</body>
</html>
